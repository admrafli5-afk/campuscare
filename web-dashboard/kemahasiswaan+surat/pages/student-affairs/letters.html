<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/student-affairs.css">

  <title>Data Surat</title>

  <style>

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    .badge-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-success {
      background: #dcfce7;
      color: #166534;
    }

    .badge-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters button {
      background: white;
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
    }

    .filters button:hover {
      background: #ecfdf5;
      color: var(--primary);
    }

  </style>

</head>
<body>

<div class="container">

  <aside class="sidebar">

    <div class="logo">CampusCare</div>

    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="students.html">Mahasiswa</a>
      <a href="letters.html">Surat</a>
      <a href="approvals.html">Approval</a>
      <a href="reports.html">Laporan</a>
      <a href="settings.html">Pengaturan</a>
      <a href="login.html">Logout</a>
    </div>


  </aside>

  <main class="content">

    <div class="topbar">

      <h1>Data Surat Mahasiswa</h1>

      <button class="btn btn-primary">
        + Tambah Surat
      </button>

    </div>

    <div class="filters">
      <button>Semua</button>
      <button>Pending</button>
      <button>Disetujui</button>
      <button>Ditolak</button>
    </div>

    <div class="card">

      <table class="table">

        <thead>
          <tr>
            <th>No</th>
            <th>Mahasiswa</th>
            <th>Jenis Surat</th>
            <th>Tanggal</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td>1</td>
            <td>Rafli Akbar</td>
            <td>Surat Aktif Kuliah</td>
            <td>18 Mei 2026</td>

            <td>
              <span class="badge badge-warning">
                Pending
              </span>
            </td>

            <td>
              <button class="btn btn-primary">
                Detail
              </button>
            </td>
          </tr>

          <tr>
            <td>2</td>
            <td>Siti Aisyah</td>
            <td>Surat Beasiswa</td>
            <td>17 Mei 2026</td>

            <td>
              <span class="badge badge-success">
                Disetujui
              </span>
            </td>

            <td>
              <button class="btn btn-primary">
                Detail
              </button>
            </td>
          </tr>

          <tr>
            <td>3</td>
            <td>Budi Santoso</td>
            <td>Surat Organisasi</td>
            <td>16 Mei 2026</td>

            <td>
              <span class="badge badge-danger">
                Ditolak
              </span>
            </td>

            <td>
              <a href="letter-detail.html">
            <button class="btn btn-primary">
                 Detail
            </button>
              </a>
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </main>

</div>

</body>
</html>
