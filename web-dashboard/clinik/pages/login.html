<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusCare — Login Klinik Mahasiswa</title>
<meta name="description" content="Masuk ke dashboard CampusCare, sistem manajemen klinik kampus untuk mahasiswa dan dosen."/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

  :root{
    --primary:#047857;
    --primary-hover:#036647;
    --mint:#D1FAE5;
    --leaf:#22C55E;
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --text:#0F172A;
    --text-muted:#64748B;
    --text-soft:#94A3B8;
    --border:#E2E8F0;
    --radius:16px;
    --radius-lg:24px;
    --shadow-card:0 10px 40px -12px rgba(15,23,42,0.08);
    --shadow-btn:0 8px 24px -8px rgba(4,120,87,0.55);
    --shadow-logo:0 8px 20px -6px rgba(4,120,87,0.45);
  }

  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    line-height:1.5;
  }

  .container{width:100%;max-width:440px}

  /* Logo */
  .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
  .logo-icon{
    width:48px;height:48px;border-radius:14px;
    background:var(--primary);
    display:grid;place-items:center;
    box-shadow:var(--shadow-logo);
    color:#fff;
  }
  .logo-text h2{font-size:20px;font-weight:700;letter-spacing:-0.01em}
  .logo-text p{font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:var(--leaf);margin-top:2px}

  /* Card */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 36px;
    box-shadow:var(--shadow-card);
  }

  .card-head{margin-bottom:28px}
  .card-head h1{font-size:24px;font-weight:700;letter-spacing:-0.015em;margin-bottom:6px}
  .card-head p{font-size:14px;color:var(--text-muted)}

  /* Form */
  form{display:flex;flex-direction:column;gap:20px}
  .field label{
    display:block;font-size:11px;font-weight:600;letter-spacing:0.08em;
    text-transform:uppercase;color:#475569;margin-bottom:8px;
  }
  .input-wrap{position:relative}
  .input-wrap svg.icon-left{
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;color:var(--text-soft);
    pointer-events:none;transition:color .2s;
  }
  .input-wrap input{
    width:100%;height:48px;
    padding:0 16px 0 44px;
    border:1px solid var(--border);
    background:var(--bg);
    border-radius:12px;
    font-size:15px;font-family:inherit;color:var(--text);
    transition:all .2s;
  }
  .input-wrap input::placeholder{color:var(--text-soft)}
  .input-wrap input:focus{
    outline:none;border-color:var(--primary);background:#fff;
    box-shadow:0 0 0 4px var(--mint);
  }
  .input-wrap input:focus + .icon-left,
  .input-wrap input:focus ~ svg.icon-left{color:var(--primary)}
  .input-wrap.has-toggle input{padding-right:48px}
  .toggle-pass{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;
    width:32px;height:32px;border-radius:8px;
    display:grid;place-items:center;color:var(--text-soft);
    transition:color .2s;
  }
  .toggle-pass:hover{color:var(--primary)}
  .toggle-pass svg{width:18px;height:18px}

  /* Row */
  .row{display:flex;align-items:center;justify-content:space-between;padding-top:4px}
  .remember{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:#475569;user-select:none}
  .remember input{position:absolute;opacity:0;pointer-events:none}
  .checkbox{
    width:18px;height:18px;border-radius:6px;
    border:1.5px solid var(--border);background:#fff;
    display:grid;place-items:center;transition:all .2s;
  }
  .checkbox svg{width:12px;height:12px;color:#fff;opacity:0;transition:opacity .15s}
  .remember input:checked + .checkbox{background:var(--primary);border-color:var(--primary)}
  .remember input:checked + .checkbox svg{opacity:1}
  .forgot{font-size:14px;font-weight:500;color:var(--primary);text-decoration:none}
  .forgot:hover{text-decoration:underline;text-underline-offset:4px}

  /* Button */
  .btn{
    width:100%;height:48px;border:none;cursor:pointer;
    background:var(--primary);color:#fff;
    border-radius:12px;font-size:15px;font-weight:600;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:var(--shadow-btn);
    transition:all .2s;
  }
  .btn:hover:not(:disabled){background:var(--primary-hover);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.7;cursor:not-allowed}
  .btn svg{width:16px;height:16px;transition:transform .2s}
  .btn:hover svg.arrow{transform:translateX(2px)}
  .spinner{animation:spin 1s linear infinite}

  /* Footer */
  .card-foot{margin-top:28px;text-align:center}
  .card-foot p{font-size:12px;color:var(--text-soft);margin-bottom:12px}
  .badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 10px;border-radius:999px;
    background:var(--mint);color:var(--primary);
    font-size:11px;font-weight:600;
  }
  .badge svg{width:12px;height:12px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf)}

  .copyright{text-align:center;font-size:12px;color:var(--text-soft);margin-top:24px}

  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:480px){
    .card{padding:32px 24px}
    .card-head h1{font-size:22px}
  }
</style>
</head>
<body>
  <main class="container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/>
        </svg>
      </div>
      <div class="logo-text">
        <h2>CampusCare</h2>
        <p>Klinik Mahasiswa</p>
      </div>
    </div>

    <!-- Card -->
    <section class="card">
      <header class="card-head">
        <h1>Selamat datang kembali 👋</h1>
        <p>Masuk ke dashboard klinik Anda</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input id="email" type="email" placeholder="nama@kampus.ac.id" autocomplete="email" required />
            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap has-toggle">
            <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
            <svg class="icon-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Tampilkan password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" checked />
            <span class="checkbox">
              <svg viewBox="0 0 12 12" fill="none"><path d="M2 6l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            Ingat saya
          </label>
          <a href="#" class="forgot">Lupa password?</a>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span id="btnText">Masuk ke Dashboard</span>
          <svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        </button>
      </form>

      <footer class="card-foot">
        <p>Sistem manajemen klinik kampus</p>
        <div class="badges">
          <span class="badge">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V5l8-3 8 3v8z"/><path d="m9 12 2 2 4-4"/></svg>
            SSL Aman
          </span>
          <span class="badge"><span class="dot"></span> v2.4 Klinik</span>
        </div>
      </footer>
    </section>

    <p class="copyright">© 2026 CampusCare · Untuk mahasiswa &amp; dosen</p>
  </main>

<script>
  // Toggle password visibility
  const toggle = document.getElementById('togglePass');
  const passInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOpen = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  const eyeClosed = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';

  toggle.addEventListener('click', () => {
    const isPass = passInput.type === 'password';
    passInput.type = isPass ? 'text' : 'password';
    eyeIcon.innerHTML = isPass ? eyeClosed : eyeOpen;
    toggle.setAttribute('aria-label', isPass ? 'Sembunyikan password' : 'Tampilkan password');
  });

  // Form submit with loading state
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('submitBtn');
  const btnText = document.getElementById('btnText');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerHTML = '<svg class="spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Memproses...';

    setTimeout(() => {
      btn.disabled = false;
      btn.innerHTML = '<span>Masuk ke Dashboard</span><svg class="arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
    }, 1200);
  });
</script>
</body>
</html>
