<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Klinik - CampusCare</title>

  <link rel="stylesheet" href="../../assets/css/variables.css" />
  <link rel="stylesheet" href="../../assets/css/global.css" />
  <link rel="stylesheet" href="../../assets/css/clinic.css" />
</head>
<body>
  <main class="login-page">
    <section class="card login-card">
      <h1 class="login-title">CampusCare</h1>
      <p class="login-subtitle">Web Dashboard Klinik Kampus</p>

      <div id="errorMessage" class="error-message"></div>

      <form id="loginForm">
        <label>Email</label>
        <input
          id="email"
          class="input"
          type="email"
          value="petugas@campuscare.test"
          placeholder="petugas@campuscare.test"
        />

        <br /><br />

        <label>Password</label>
        <input
          id="password"
          class="input"
          type="password"
          value="123456"
          placeholder="Masukkan password"
        />

        <br /><br />

        <button id="loginButton" class="btn btn-primary" type="submit" style="width:100%;">
          Masuk
        </button>
      </form>
    </section>
  </main>

  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/clinic/notification.js"></script>
  <script src="../../assets/js/clinic/auth.js"></script>
</body>
</html>
