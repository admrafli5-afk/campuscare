<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CampusCare Login</title>

  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/student-affairs.css">
</head>
<body>

<div class="container" style="justify-content:center;align-items:center;">

  <div class="card" style="width:400px;">
    <div class="logo">CampusCare</div>

    <h2>Login Kemahasiswaan</h2>

    <br>

    <input id="email" type="email" placeholder="Email"
      style="width:100%;padding:14px;margin-bottom:14px;border:1px solid #ddd;border-radius:12px;">

    <input id="password" type="password" placeholder="Password"
      style="width:100%;padding:14px;margin-bottom:20px;border:1px solid #ddd;border-radius:12px;">

    <button onclick="login()"
      style="width:100%;padding:14px;border:none;border-radius:12px;background:#10b981;color:white;font-weight:bold;">
      Masuk
    </button>
  </div>

</div>

<script>
function login() {
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
